[package]
name = "group"
version = "0.2.0"
edition = "2021"
license = "CC-BY-NC-ND-4.0"

[dependencies]
# The deployed revision of crypto-bigint, compiled in as a second crate for `sampling`: seeded
# key derivation must keep reproducing the values that revision produced. Pinned forever.
crypto-bigint-legacy = { package = "crypto-bigint", git = "https://github.com/ycscaly/crypto-bigint.git", rev = "8aabcee553b25f9f619722391de33edbe2f7412c", default-features = false, features = ["rand_core"] }
crypto-bigint = { workspace = true, features = ["serde"], default-features = false }
serde = { workspace = true, features = ["derive"] }
subtle = { workspace = true, features = ["const-generics"] }
thiserror = { workspace = true }
k256 = { workspace = true, features = ["arithmetic", "critical-section", "precomputed-tables", "serde", "hash2curve", "alloc"], default-features = false }
p256 = { workspace = true, features = ["arithmetic", "serde", "hash2curve", "alloc"], default-features = false }
curve25519-dalek = { workspace = true, features = ["serde", "digest", "group"], default-features = false }
hash2curve = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
blake2b_simd = { workspace = true }
itertools = { workspace = true }
rayon = { workspace = true, optional = true }
rand = { workspace = true, default-features = false,  features = ["alloc"] }
rand_chacha = { workspace = true, default-features = false }
rand_core = { workspace = true }
# TEMPORARY (two crypto-bigint versions): only for the `Rng010` adapter in `csrng.rs`; see the root manifest.
rand_core_010 = { workspace = true }
shake = { workspace = true }
getrandom = { workspace = true, optional = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

# For Benchmarking.
criterion = { workspace = true, default-features = false, features = ["html_reports", "cargo_bench_support", "rayon"], optional = true }

[dev-dependencies]
sha2 = { workspace = true }
k256 = { workspace = true, features = ["arithmetic", "critical-section", "precomputed-tables", "serde", "hash2curve", "alloc", "ecdsa"], default-features = false }
rand = { workspace = true }
getrandom = { workspace = true }
rand_core = { workspace = true, features = ["os_rng"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }

[features]
test_helpers = []
os_rng = ["dep:getrandom", "rand_core/os_rng"]
wasm_js = ["os_rng", "getrandom/wasm_js"]
benchmarking = ["dep:criterion", "rand_core/std"]
parallel = ["dep:rayon"]

[[bench]]
name = "benches"
harness = false

[lints]
workspace = true
