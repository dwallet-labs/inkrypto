[package]
name = "mpc"
version = "0.2.0"
edition = "2021"
license = "CC-BY-NC-ND-4.0"

[dependencies]
crypto-bigint = { workspace = true, features = ["serde"], default-features = false }
gcd = { workspace = true }
merlin = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
group = { path = "../group" }
commitment = { path = "../commitment" }
maurer = { path = "../maurer" }
proof = { path = "../proof" }
thiserror = { workspace = true }
itertools = { workspace = true }
rand = { workspace = true, default-features = false,  features = ["alloc"] }
rstest = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
criterion = { workspace = true, default-features = false, features = ["html_reports", "cargo_bench_support", "rayon"], optional = true }
rand_chacha = { workspace = true, default-features = false }
bcs.workspace = true
hpke.workspace = true
aead = { workspace = true }
generic-array = { workspace = true }
curve25519-dalek.workspace = true
sha2.workspace = true
chacha20poly1305 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
group = { path = "../group", features = ["wasm_js"] }

[dev-dependencies]
rstest = { workspace = true }
group = { path = "../group", features = ["os_rng"] }
criterion = { workspace = true, features = ["html_reports"] }

[features]
default = []
test_helpers = ["group/os_rng", "dep:rstest", "dep:criterion"]
parallel = ["dep:rayon"]
# INSECURE test-only: short-circuit UC-proof verification of encryption keys.
unsafe_mock = []

[lints]
workspace = true
